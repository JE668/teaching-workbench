# 1对1教学工作台 - Docker Compose 编排
# 使用方式: docker compose up -d

services:
  # ====== 后端服务 ======
  backend:
    image: ghcr.io/je668/teaching-workbench-backend:${TAG:-latest}
    container_name: teaching-workbench-backend
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - SENSENOVA_API_KEY=${SENSENOVA_API_KEY}
      - SENSENOVA_BASE_URL=${SENSENOVA_BASE_URL:-https://token.sensenova.cn/v1}
      - SENSENOVA_MODEL=${SENSENOVA_MODEL:-sensenova-6.8-flash-lite}
      - SENSENOVA_REASONING_EFFORT=${SENSENOVA_REASONING_EFFORT:-low}
      - DEFAULT_ADMIN_USER=${DEFAULT_ADMIN_USER:-admin}
      - DEFAULT_ADMIN_PASS=${DEFAULT_ADMIN_PASS:-123456}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    volumes:
      - db_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - workbench

  # ====== 前端服务 ======
  frontend:
    image: ghcr.io/je668/teaching-workbench-frontend:${TAG:-latest}
    container_name: teaching-workbench-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - workbench

# ====== 数据卷 ======
volumes:
  db_data:
    name: teaching_workbench_db

# ====== 网络 ======
networks:
  workbench:
    driver: bridge
    name: teaching_workbench_net
