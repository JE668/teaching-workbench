# 1对1教学工作台 - Docker Compose 编排
# 使用方式: docker compose up -d

services:
  # ====== 后端服务 ======
  backend:
    image: ghcr.io/je668/teaching-workbench-backend:${TAG:-latest}
    container_name: teaching-workbench-backend
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      # 时区必须显式声明：容器默认 UTC，不设的话库里所有时间戳慢 8 小时
      - TZ=Asia/Shanghai
      - PORT=3000
      - HOST=0.0.0.0
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - SENSENOVA_API_KEY=${SENSENOVA_API_KEY}
      - SENSENOVA_BASE_URL=${SENSENOVA_BASE_URL:-https://token.sensenova.cn/v1}
      - SENSENOVA_MODEL=${SENSENOVA_MODEL:-sensenova-6.8-flash-lite}
      - SENSENOVA_REASONING_EFFORT=${SENSENOVA_REASONING_EFFORT:-low}
      - SENSENOVA_TIMEOUT_MS=${SENSENOVA_TIMEOUT_MS:-60000}
      # 【Gemini 转发代理】自建 OpenAI 兼容层，可选。不配也能用——只是设置页里
      # 切到 gemini-proxy 时没有默认 Key。
      # 这三行必须透传进容器：漏掉任何一行，.env 里配的 gemini Key 都到不了后端，
      # 表现是「切换服务商后 gemini 一直报 401」，且日志里不会有任何提示。
      - GEMINI_PROXY_API_KEY=${GEMINI_PROXY_API_KEY}
      - GEMINI_PROXY_BASE_URL=${GEMINI_PROXY_BASE_URL}
      - GEMINI_PROXY_MODEL=${GEMINI_PROXY_MODEL:-gemini-3.8-flash}
      - DEFAULT_ADMIN_USER=${DEFAULT_ADMIN_USER:-admin}
      - DEFAULT_ADMIN_PASS=${DEFAULT_ADMIN_PASS:-123456}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # /metrics 监控口令：生产环境留空=端点 404；要开监控请设置（openssl rand -hex 16）
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      # AI 指标保留天数：超期运营遥测行定期删除，防表无限增长。默认 90
      - AI_METRICS_RETAIN_DAYS=${AI_METRICS_RETAIN_DAYS:-90}
      # AI 流式空闲超时（毫秒）：上游中途不发内容就中断释放并发槽。默认 60000
      - AI_STREAM_IDLE_TIMEOUT_MS=${AI_STREAM_IDLE_TIMEOUT_MS:-60000}
    # 【持久化】数据直接落在 compose 同级目录，方便查看与备份。
    # 想放别处就改 .env 里的 DATA_PATH。
    # 注意：容器默认以 UID 1001 运行，而 NAS 上的目录通常属于 1000，
    # 因此这里用 PUID/PGID 覆盖运行身份（在 .env 里设成目录的属主即可）。
    user: "${PUID:-1001}:${PGID:-1001}"
    volumes:
      - ${DATA_PATH:-./data}:/app/data
    restart: unless-stopped
    # 【资源上限】NAS 上通常还跑着别的服务。不设上限时，一个卡死的生成/OCR 可以把
    # 整机内存吃光，表现是「工作台和 NAS 一起失去响应」。设了上限只会 OOM 掉本容器，
    # 由 restart 策略自动拉回，其他服务不受影响。
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}
    cpus: ${BACKEND_CPUS:-2.0}
    # 停止前留出收尾时间：SQLite 事务、流式生成、日志 flush 都需要（默认 10s 会被硬杀）
    stop_grace_period: 30s
    # 容器内进程不允许提权（防线之一，配合非 root 用户运行）
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - workbench

  # ====== 前端服务 ======
  frontend:
    image: ghcr.io/je668/teaching-workbench-frontend:${TAG:-latest}
    container_name: teaching-workbench-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    # 静态站点很轻：256m/1 核足够，设上限防异常流量把 NAS 内存吃光
    mem_limit: ${FRONTEND_MEM_LIMIT:-256m}
    cpus: ${FRONTEND_CPUS:-1.0}
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - workbench

# ====== 网络 ======
networks:
  workbench:
    driver: bridge
    name: teaching_workbench_net
