# 前端 Nginx 配置
# 职责: 服务 React 构建产物 + 反向代理 API 请求到后端

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ====== 安全头 ======
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ====== Gzip 压缩 ======
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ====== 静态资源缓存 ======
    # 限定在构建产物目录（Vite 输出到 /assets/）。
    # 不加限定的话，凡是 .png/.js 结尾的请求都会被这条正则截胡 ——
    # 包括 /uploads/ 下的图片，导致图片 404。
    location ~* ^/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ====== 请求体大小 ======
    # 关键：nginx 默认只允许 1MB，而手机拍的照片通常 2-8MB。
    # 不放开的话，上传会在 nginx 层就被 413 拒绝 ——
    # 而且 nginx 的 413 是 HTML 错误页，前端解析 JSON 失败后
    # 只能显示笼统的"上传失败"，极难排查。
    # 这里设 12m（后端 multer 限制 10m），留出余量让后端能返回它自己的 JSON 错误。
    client_max_body_size 12m;

    # nginx 层拒绝时也返回 JSON，保证前端能显示具体原因
    error_page 413 = @too_large;
    location @too_large {
        default_type application/json;
        return 413 '{"error":"图片过大，单张不能超过 10MB"}';
    }

    # ====== API 反向代理 ======
    # 同样用 ^~：避免将来出现以 .json/.js 结尾的接口路径被静态正则截胡
    location ^~ /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ===== SSE 流式生成必需 =====
        # 1) 清空 Connection 头，保持到后端的连接为 keep-alive 而非 upgrade
        #    （本项目不使用 WebSocket）
        # 2) 关闭响应缓冲，否则 AI 流式输出会被 nginx 攒满后才一次性下发，
        #    表现为"转圈很久然后突然全部出现"，流式效果完全失效。
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;

        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ====== 上传文件反向代理 ======
    # 【必须用 ^~】nginx 的匹配顺序是：= 精确 > ^~ 前缀 > 正则 > 普通前缀。
    # 上面的静态资源用了正则 location（匹配 .png 等后缀），
    # 若不写 ^~，/uploads/1/abc.png 会被那个正则抢走，
    # 去静态目录找文件 → 404，图片永远显示不出来（且不会转发到后端）。
    location ^~ /uploads/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ====== 健康检查代理 ======
    location /health {
        proxy_pass http://backend:3000/health;
        proxy_set_header Host $host;
    }

    # ====== SPA 路由回退 ======
    location / {
        try_files $uri $uri/ /index.html;
    }
}
