# ==========================================================================
# 前端安全响应头 —— 唯一真源
#
# 为什么单独抽一个文件：
#   nginx 的 add_header 不继承：只要某个 location 自己写了 add_header，
#   它就不再继承 server 级的任何 add_header。原来 /assets/ 那个 location
#   为了加 Cache-Control，把 4 个安全头 + 一长串 CSP 又手工复制了一遍，
#   两份字符串迟早漂移（改一处忘一处 = 某些资源没有 CSP）。
#   现在统一 include 本文件，任何修改只改这里。
#
# 用法：server {} 内 include 一次（覆盖普通页面），
#      自带 add_header 的 location 内再 include 一次。
# ==========================================================================

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;

# CSP 说明：
# - default-src 'self'      全部资源限本站，挡住外链脚本/图片/表单外发。
# - script-src 'self'       无内联脚本。Vite 产物是外链 module，index.html
#                           里没有内联 <script>，所以不需要 unsafe-inline。
# - style-src 'unsafe-inline'  Tailwind + framer-motion 会往元素上写 inline
#                           style 属性，这项去不掉（去掉会整站失色）。
# - img-src data: blob:     favicon 是 data:image/svg+xml；上传预览走 blob:。
# - connect-src 'self'      fetch/XHR/SSE 全部同源（/api 由 nginx 反代）。
# - frame-ancestors 'self'  允许本站自己 iframe，禁止外站嵌套（与 XFO 一致）。
# - object-src 'none'       禁 <object>/<embed>。
#
# 由 Report-Only 转为强制（去掉 -Report-Only）：页面结构不依赖内联脚本，
# 继续灰度只会让"写了等于没防"。若某浏览器出现违规，按上报的指令放行即可。
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
