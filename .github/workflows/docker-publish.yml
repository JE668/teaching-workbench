name: Build & Publish Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ===== 先跑测试，通过后才构建镜像 =====
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Type check & build
        working-directory: server
        run: npm run build

      - name: Run test suite
        working-directory: server
        run: npm test

  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v7
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/je668/teaching-workbench-backend:latest
            ghcr.io/je668/teaching-workbench-backend:${{ github.sha }}
            ghcr.io/je668/teaching-workbench-backend:v${{ github.ref_name || '0' }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          labels: |
            org.opencontainers.image.title=teaching-workbench-backend
            org.opencontainers.image.description=1对1教学工作台后端
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./web
          push: true
          tags: |
            ghcr.io/je668/teaching-workbench-frontend:latest
            ghcr.io/je668/teaching-workbench-frontend:${{ github.sha }}
            ghcr.io/je668/teaching-workbench-frontend:v${{ github.ref_name || '0' }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          labels: |
            org.opencontainers.image.title=teaching-workbench-frontend
            org.opencontainers.image.description=1对1教学工作台前端
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}