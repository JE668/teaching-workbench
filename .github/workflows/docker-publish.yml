name: Build & Publish Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']
  # PR 分支只跑测试、不发布镜像（镜像构建对 GITHUB_TOKEN 有权限要求，且不应污染 GHCR）
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 同一分支/PR 上排队的新 run 直接取消旧的：连续 push 时只跑最新一版，
# 省 runner 分钟，也避免旧 run 的镜像构建晚于新 run 完成、把 latest 标签推回旧代码。
# tag（发版）不取消，保证发布链路完整。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  # ===== 先跑测试，通过后才构建镜像 =====
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 历史：这里曾围绕 tesseract 装/删系统包、TESSDATA_PREFIX 做过大量变通，
    # 但 OCR worker 在测试里初始化仍会卡死（语言数据下载/加载无人等待）。
    # 现在根因已修：NODE_ENV=test 时 services/ocr.ts 直接跳过真实 OCR，
    # CI 不再需要任何 Tesseract 环境准备。
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Copy shared module
        run: cp -r shared server/src/shared
        working-directory: ${{ github.workspace }}

      - name: Install dependencies
        working-directory: server
        run: npm ci

      # 生产依赖高危门禁：high/critical 直接挡红（exceljs 传递链 moderate 为上游无修复项，不拦）
      - name: Dependency audit (prod, high gate)
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

      - name: Clear TypeScript cache
        working-directory: server
        run: rm -rf node_modules/.cache .tsx.cache 2>/dev/null || true

      - name: Type check & build
        working-directory: server
        timeout-minutes: 5
        run: npm run build

      - name: Run test suite
        working-directory: server
        timeout-minutes: 15
        run: npm test -- --test-concurrency=4

  test-web:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Copy shared module
        run: cp -r shared web/src/shared
        working-directory: ${{ github.workspace }}

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # 生产依赖高危门禁（与后端同理，moderate 的 exceljs 传递链不拦）
      - name: Dependency audit (prod, high gate)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

      - name: Clear TypeScript cache
        working-directory: web
        run: rm -rf node_modules/.cache .tsx.cache 2>/dev/null || true

      - name: Type check（含测试代码）
        working-directory: web
        timeout-minutes: 5
        run: npm run typecheck

      - name: Run test suite
        working-directory: web
        timeout-minutes: 10
        run: npm test -- --pool=forks

  # ===== 部署资产检查 =====
  # 事故：Dockerfile 曾只 COPY dist/，漏了 templates/ ——
  # 本地和测试环境模板都在，测试全绿，只有线上容器 ENOENT，Word 导出 500。
  # 这个 job 不依赖 docker 守护进程，纯静态校验。
  # 检查逻辑收在 scripts/check-deploy-assets.sh，本地 push 前可跑同一个脚本。
  deploy-assets:
    name: Docker Deploy Assets & Runtime Guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 部署资产与运行时守护
        run: bash scripts/check-deploy-assets.sh

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test, test-web]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Copy shared module for e2e
        run: |
          cp -r shared server/src/shared
          cp -r shared web/src/shared

      - name: Clear TypeScript cache (e2e)
        run: |
          cd server && rm -rf node_modules/.cache .tsx.cache 2>/dev/null || true
          cd ../web && rm -rf node_modules/.cache .tsx.cache 2>/dev/null || true

      # 复用 runner 自带的 Google Chrome（channel: 'chrome'），无需下载浏览器
      - name: Show Chrome version
        run: google-chrome --version || true

      - name: Build backend & frontend
        working-directory: web
        run: npm run e2e:prepare

      - name: Run E2E tests
        working-directory: web
        timeout-minutes: 15
        # 不带 --workers：playwright.config 明确 workers:1（用例共享同一后端与 DB，
        # 串行是设计约束）。之前这里用 --workers=2 覆盖，并发互相干扰导致用例轮换式 flaky。
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  build-backend:
    name: Build & Push Backend
    # PR 阶段只验证测试与 E2E，镜像发布留给 main / tag
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # deploy-assets 必须挡在镜像构建前：模板或时区守护一破就不能发镜像
    needs: [test, deploy-assets, e2e]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Copy shared module
        run: cp -r shared server/src/shared
        working-directory: ${{ github.workspace }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v7
        timeout-minutes: 25
        with:
          context: ./server
          push: true
          # 烤进镜像的提交号：/health 和容器环境变量都能看到，用来确认线上跑的是哪一版
          # 坑：必须写成字符串，不能写成映射。build-push-action 的 action.yml 里 build-args
          # 没声明 type，GitHub 平台默认按字符串校验，传映射直接报
          # "A mapping was not expected"（本地 js-yaml/psych 只查语法、不查 action 输入类型，
          # 所以本地全绿、只有 GitHub 的校验器报错）。格式是每行一个 KEY=VALUE
          build-args: |
            BUILD_SHA=${{ github.sha }}
          # 标签策略：latest（部署用）+ 提交 SHA（回滚用，可精确定位）
          tags: |
            ghcr.io/je668/teaching-workbench-backend:latest
            ghcr.io/je668/teaching-workbench-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          labels: |
            org.opencontainers.image.title=teaching-workbench-backend
            org.opencontainers.image.description=1对1教学工作台后端
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  build-frontend:
    name: Build & Push Frontend
    # 同上：PR 不发布镜像
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test-web, deploy-assets, e2e]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Copy shared module
        run: cp -r shared web/src/shared
        working-directory: ${{ github.workspace }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v7
        timeout-minutes: 20
        with:
          context: ./web
          push: true
          # 标签策略：latest（部署用）+ 提交 SHA（回滚用，可精确定位）
          tags: |
            ghcr.io/je668/teaching-workbench-frontend:latest
            ghcr.io/je668/teaching-workbench-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          labels: |
            org.opencontainers.image.title=teaching-workbench-frontend
            org.opencontainers.image.description=1对1教学工作台前端
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}