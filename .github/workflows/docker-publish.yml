name: Build & Publish Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ===== 先跑测试，通过后才构建镜像 =====
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Type check & build
        working-directory: server
        run: npm run build

      - name: Run test suite
        working-directory: server
        run: npm test

  test-web:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type check（含测试代码）
        working-directory: web
        run: npm run typecheck

      - name: Run test suite
        working-directory: web
        run: npm test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [test, test-web]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # 复用 runner 自带的 Google Chrome（channel: 'chrome'），无需下载浏览器
      - name: Show Chrome version
        run: google-chrome --version || true

      - name: Build backend & frontend
        working-directory: web
        run: npm run e2e:prepare

      - name: Run E2E tests
        working-directory: web
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    needs: [test, e2e]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v7
        with:
          context: ./server
          push: true
          # 标签策略：latest（部署用）+ 提交 SHA（回滚用，可精确定位）
          tags: |
            ghcr.io/je668/teaching-workbench-backend:latest
            ghcr.io/je668/teaching-workbench-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          labels: |
            org.opencontainers.image.title=teaching-workbench-backend
            org.opencontainers.image.description=1对1教学工作台后端
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    needs: [test-web, e2e]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./web
          push: true
          # 标签策略：latest（部署用）+ 提交 SHA（回滚用，可精确定位）
          tags: |
            ghcr.io/je668/teaching-workbench-frontend:latest
            ghcr.io/je668/teaching-workbench-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          labels: |
            org.opencontainers.image.title=teaching-workbench-frontend
            org.opencontainers.image.description=1对1教学工作台前端
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}