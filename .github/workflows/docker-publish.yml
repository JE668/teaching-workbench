test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Tesseract OCR
        working-directory: server
        timeout-minutes: 5
        run: |
          set -euo pipefail
          echo "Checking Tesseract OCR availability..."
          
          # Check if tesseract is already available with required languages
          if command -v tesseract >/dev/null 2>&1; then
            LANGS=$(tesseract --list-langs 2>/dev/null || true)
            if echo "$LANGS" | grep -q 'chi_sim' && echo "$LANGS" | grep -q 'eng'; then
              echo "✅ Tesseract already installed with required languages"
              tesseract --list-langs
              exit 0
            fi
          fi
          
          echo "Installing Tesseract OCR via apt..."
          
          # Wait for apt lock with longer timeout
          for i in {1..60}; do
            if ! lsof /var/lib/dpkg/lock-frontend >/dev/null 2>&1 && ! lsof /var/lib/apt/lists/lock >/dev/null 2>&1; then
              break
            fi
            echo "Waiting for apt lock... ($i/60)"
            sleep 2
          done
          
          # Use explicit locking and non-interactive mode
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y && apt-get install -y tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng
          
          # Verify installation
          tesseract --list-langs | grep -E 'chi_sim|eng' || {
            echo "ERROR: Required languages not installed"
            tesseract --list-langs || true
            exit 1
          }
          echo "✅ Tesseract OCR installed with chi_sim and eng languages"
          tesseract --list-langs

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Copy shared module
        run: cp -r shared server/src/shared
        working-directory: ${{ github.workspace }}

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Clear TypeScript cache
        working-directory: server
        run: rm -rf node_modules/.cache .tsx.cache 2>/dev/null || true

      - name: Type check & build
        working-directory: server
        timeout-minutes: 5
        run: npm run build

      - name: Run test suite
        working-directory: server
        timeout-minutes: 15
        run: npm test -- --test-concurrency=4